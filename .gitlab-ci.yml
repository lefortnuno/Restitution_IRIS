image: alpine:latest

stages:
  - deploy

deploy_production:
  stage: deploy
  before_script:
    - apk add --no-cache openssh
  script:
    - echo "$SSH_PRIVATE_KEY" > key.pem
    - chmod 600 key.pem
    - ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@13.48.104.63 "
        cd /home/ubuntu/aws_restitution &&
        docker login registry.gitlab.com -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD &&
        docker pull registry.gitlab.com/lefortnuno/restitution_iris/backend:latest &&
        docker pull registry.gitlab.com/lefortnuno/restitution_iris/frontend:latest &&
        docker pull registry.gitlab.com/lefortnuno/restitution_iris/nginx:latest &&
        docker compose down -v &&
        docker compose up -d
      "
  only:
    - main
    